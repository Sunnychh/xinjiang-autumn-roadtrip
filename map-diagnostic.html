<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>地图加载诊断</title><style>body{font:16px system-ui;margin:32px;background:#f5f4ed;color:#173c3d}main{display:flex;gap:24px;flex-wrap:wrap}section{padding:20px;border:1px solid #bccbc1;width:320px}img{display:block;width:256px;height:256px;margin-top:12px;background:#ddd}pre{white-space:pre-wrap;font-size:12px;line-height:1.7}</style><h1>行程地图加载检查</h1><p>只检查当前行程区域的一张瓦片，沿用浏览器默认缓存和真实网页来源。</p><main><section><h2>标准图片加载</h2><pre id="native-status">等待图片</pre><img id="native" alt="当前行程区域的地图" crossorigin="anonymous" referrerpolicy="strict-origin-when-cross-origin"></section><section><h2>Fetch 加载</h2><pre id="fetch-status">等待标准图片完成后检查</pre><img id="fetched" alt="同一地图的Fetch结果"></section></main><script>
const tile='https://tile.openstreetmap.org/7/93/46.png',start=performance.now(),log=(id,s)=>document.getElementById(id).textContent+=`\n${((performance.now()-start)/1000).toFixed(1)}s ${s}`;
const im=document.getElementById('native');let started=false;
async function inspectFetch(){if(started)return;started=true;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);log('fetch-status','开始fetch');try{const r=await fetch(tile,{mode:'cors',credentials:'omit',cache:'default',referrerPolicy:'strict-origin-when-cross-origin',signal:controller.signal});log('fetch-status','HTTP '+r.status);const blob=await r.blob();log('fetch-status',`body ${blob.size} bytes / ${blob.type}`);const url=URL.createObjectURL(blob),img=document.getElementById('fetched');img.onload=()=>{log('fetch-status','图片显示完成');URL.revokeObjectURL(url)};img.onerror=()=>log('fetch-status','图片解码失败');img.src=url}catch(e){log('fetch-status',e.name+': '+e.message)}finally{clearTimeout(timer)}}
im.onload=()=>{log('native-status',`成功 ${im.naturalWidth}×${im.naturalHeight}`);inspectFetch()};im.onerror=()=>{log('native-status','图片加载错误');inspectFetch()};im.src=tile;setTimeout(()=>{if(!im.naturalWidth)log('native-status','15秒后仍未加载')},15000);
</script></html>
